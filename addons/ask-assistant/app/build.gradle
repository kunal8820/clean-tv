plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.nitzzzu.voicechat'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.nitzzzu.voicechat'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Sideloaded over ADB like the launcher: signed with the debug key.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // QR code for the setup screen (encoder only; R8 drops the rest).
    implementation 'com.google.zxing:core:3.5.3'
}
